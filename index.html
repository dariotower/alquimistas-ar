
<!DOCTYPE html>
<html>
  <head>
    <title>Alquimistas AR</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/aframe-mindar-image.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ar-button {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #c56;
        color: white;
        padding: 12px 24px;
        border: none;
        font-size: 16px;
        border-radius: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <button id="ar-button" onclick="window.location.href='https://alquimistas.ar/pagina-vacia.html'">Ver más</button>

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: yes;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-assets>
        <a-asset-item id="marker" src="targets.mind"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane position="0 0 0" height="1" width="1" material="color: transparent">
          <a-animation attribute="scale" to="1 1 1" dur="1000" easing="ease-out"></a-animation>
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('show-button', {
        init: function () {
          this.el.addEventListener('targetFound', () => {
            document.getElementById('ar-button').style.display = 'block';
          });
          this.el.addEventListener('targetLost', () => {
            document.getElementById('ar-button').style.display = 'none';
          });
        }
      });
      document.querySelector('[mindar-image-target]').setAttribute('show-button', '');
    </script>
  </body>
</html>
