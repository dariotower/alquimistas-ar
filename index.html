
<!DOCTYPE html>
<html>
  <head>
    <title>Alquimistas AR</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/aframe/mindar-image-aframe.prod.js"></script>
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; }
      #enterButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #6e4e37;
        color: #fff;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        display: none;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-assets>
        <img id="logo" src="isologo.svg" />
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#logo" position="0 0 0" height="1" width="1"></a-image>
        <a-text value="Accediste al mundo mágico de los Alquimistas del Café" width="2" align="center" position="0 -0.8 0" color="#fff"></a-text>
      </a-entity>
    </a-scene>
    <button id="enterButton" onclick="window.location.href='contenido.html'">Explorar secretos</button>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sceneEl = document.querySelector("a-scene");
        const enterButton = document.getElementById("enterButton");
        sceneEl.addEventListener("targetFound", () => {
          enterButton.style.display = "block";
        });
        sceneEl.addEventListener("targetLost", () => {
          enterButton.style.display = "none";
        });
      });
    </script>
  </body>
</html>
